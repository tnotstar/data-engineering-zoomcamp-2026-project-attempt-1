services:
  search-engine:
    image: manticoresearch/manticore:latest
    container_name: search-engine
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - ./data:/data
      - ./search-engine/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    restart: always

  dashboard:
    build: 
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "7860:7860"
    volumes:
      - ./dashboard:/app
    environment:
      - MANTICORE_URL=http://search-engine:9308
    depends_on:
      - search-engine
    restart: always

  etl-pipeline:
    build:
      context: ./etl-pipeline
      dockerfile: Dockerfile.bruin
    container_name: etl-pipeline
    volumes:
      - ./etl-pipeline:/pipeline
      - ./data:/data
    environment:
      - MANTICORE_URL=http://search-engine:9308
    command: sleep infinity
    depends_on:
      - search-engine
